name: "Weekly Long-Form Watch-Time Booster (4,000h Monetization Engine)"

on:
  schedule:
    # Runs every Thursday night / Friday morning (Peak weekend & Jumaah Quran listening)
    # 18:00 UTC Thursday = 21:00 Riyadh / 21:30 Tehran
    - cron: '0 18 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force generate & publish longform now'
        required: false
        default: false
        type: boolean

concurrency:
  group: longform-watchtime
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-publish-longform:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Restore Credentials from GitHub Secrets"
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_QURAN_B64: ${{ secrets.TOKEN_QURAN_BASE64 }}
        run: |
          if [ -n "$CLIENT_SECRETS_JSON" ]; then echo "$CLIENT_SECRETS_JSON" > client_secrets.json; fi
          if [ -n "$TOKEN_QURAN_B64" ]; then echo "$TOKEN_QURAN_B64" | base64 -d > token_quran.pickle; fi

      - name: "Install System FFmpeg"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass9 fontconfig

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Generate & Publish Long-Form Watch-Time Booster"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_WATERMARK: "@NourAlQuran"
          QURAN_MASTER_SESSION_AUTH: "AUTHORIZED_786"
        run: |
          python produce_longform_sleep_quran.py

      - name: "Commit and Push Deduplication State"
        if: always()
        run: |
          git add used_radar_ids.json upload_registry.json state.json 2>/dev/null || true
          git commit -m "chore(longform): record published longform video [skip ci]" || echo "No state changes"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "Push retry $i in 10s..."; sleep 10
          done
