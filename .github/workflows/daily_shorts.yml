name: Daily YouTube Shorts Autopilot

on:
  schedule:
    # 14:30 UTC corresponds to 18:00 (6:00 PM) Iran Standard Time (+03:30)
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System FFmpeg and Node.js (for yt-dlp JS runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs


      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Real Trend Shorts Pipeline
        run: |
          python run_pipeline.py

      - name: Commit and Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Auto-update pipeline state [skip ci]" || echo "No changes to state"
          git push
