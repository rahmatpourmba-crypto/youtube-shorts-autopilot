name: 24/7 Quran Viral Shorts Heavy Clustered Peaks (Resilient Pulse)

on:
  schedule:
    # Resilient Pulse every 30 mins at odd minutes (:18 and :48)
    # Bypasses GitHub top-of-hour congestion, queue drops, and delays
    - cron: '18,48 * * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel to execute'
        required: false
        default: 'quran'
        type: choice
        options:
          - quran
          - auto
      force:
        description: 'Bypass cooling gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System FFmpeg and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Quran Viral Reel Dispatcher (>100k views, <50s)
        run: |
          python dispatch_cycle.py --channel=quran ${{ inputs.force && '--force' || '' }}

      - name: Commit and Push Updated State (Keepalive Heartbeat Activity)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json growth_brain.json used_trends_history.json used_viral_reels.json
          git commit -m "chore(autopilot): update viral reels state and keepalive heartbeat" || echo "No changes to state"
          git push
