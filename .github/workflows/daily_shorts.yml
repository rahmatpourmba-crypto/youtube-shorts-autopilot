name: 24/7 Active Shorts & Auto-Keepalive Pipeline

on:
  schedule:
    # 24/7 Zero-Downtime Multi-Peak Pre-Production Architecture:
    # Triggers every ~4.5 hours (always under 5.5h inactivity threshold to keep repo alive forever):
    # - 02:12 UTC (05:42 IRST) -> Pre-generates Slot 0: Quran (Scheduled for 07:42 IRST peak)
    # - 06:44 UTC (10:14 IRST) -> Slot 1: Towards Eternity / Wisdom (Keepalive)
    # - 11:12 UTC (14:42 IRST) -> Pre-generates Slot 2: CryptoLab (Scheduled for 16:42 IRST peak)
    # - 15:44 UTC (19:14 IRST) -> Pre-generates Slot 3: Animals (Scheduled for 21:14 IRST peak)
    # - 20:14 UTC (23:44 IRST) -> Pre-generates Slot 4: AI Tools (Scheduled for 03:44 IRST peak)
    - cron: '12 2,11 * * *'
    - cron: '44 6,15,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System FFmpeg and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 5-Hour Round-Robin Active Dispatcher
        run: |
          python dispatch_cycle.py

      - name: Commit and Push Updated State (Keepalive Activity)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Auto-keepalive heartbeat state update [skip ci]" || echo "No changes to state"
          git push
