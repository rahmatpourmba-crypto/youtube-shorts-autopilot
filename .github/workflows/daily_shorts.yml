name: 24/7 Autonomous Viral Multi-Channel Pulse (Quran & AI Unveiled)

on:
  schedule:
    # Resilient Pulse every 30 mins at odd minutes (:18 and :48)
    # Bypasses GitHub top-of-hour congestion, queue drops, and delays
    - cron: '18,48 * * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel to execute'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - quran
          - ai
      force:
        description: 'Bypass cooling gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System FFmpeg and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Multi-Channel Dispatcher
        env:
          IG_PASSWORD_CRYPTOLAB: ${{ secrets.IG_PASSWORD_CRYPTOLAB || '2899813366' }}
          IG_PASSWORD_QURAN: ${{ secrets.IG_PASSWORD_QURAN || '2899813366' }}
        run: |
          python dispatch_cycle.py --channel=${{ inputs.target_channel || 'auto' }} ${{ inputs.force && '--force' || '' }}

      - name: Commit and Push Updated State (Keepalive Heartbeat Activity - NO skip-ci)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json growth_brain.json used_trends_history.json used_viral_reels.json used_ai_viral_reels.json ig_session_cryptolab.json token_ai.pickle
          git commit -m "chore(autopilot): update multi-channel state and keepalive heartbeat" || echo "No changes to state"
          git push
