name: 24/7 Active Shorts & Auto-Keepalive Pipeline

on:
  schedule:
    # Runs exactly every 4 hours and 30 minutes (270 minutes):
    # This guarantees the repository never reaches 6 hours of inactivity.
    # Pattern triggers 5 times per day (approx. 00:00, 04:30, 09:00, 13:30, 18:00 UTC)
    - cron: '30 0,4,9,13,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System FFmpeg and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 5-Hour Round-Robin Active Dispatcher
        run: |
          python dispatch_cycle.py

      - name: Commit and Push Updated State (Keepalive Activity)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Auto-keepalive heartbeat state update [skip ci]" || echo "No changes to state"
          git push
