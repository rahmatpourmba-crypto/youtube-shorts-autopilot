name: 24/7 Quran Viral Shorts Clustered Autopilot (7x Daily)

on:
  schedule:
    # Slot 1: 02:00 IRST (22:30 UTC) - Abdul Rahman Mossad / Raad Al-Kurdi (Tahajjud & Western Peak)
    - cron: '30 22 * * *'
    # Slot 2: 07:30 IRST (04:00 UTC) - Sheikh Yasser Al-Dosari (Morning Awakening & Keepalive)
    - cron: '0 4 * * *'
    # Slot 3: 15:00 IRST (11:30 UTC) - Sheikh Yasser Al-Dosari (Afternoon Prime Wave 1)
    - cron: '30 11 * * *'
    # Slot 4: 16:30 IRST (13:00 UTC) - Youssef Saghir (Afternoon Prime Wave 2 - Top Record Hour)
    - cron: '0 13 * * *'
    # Slot 5: 19:45 IRST (16:15 UTC) - Muhammad Al-Luhaidan (Maghrib / Evening Surge)
    - cron: '15 16 * * *'
    # Slot 6: 21:00 IRST (17:30 UTC) - Sheikh Yasser Al-Dosari (Prime Night Wave 1 - Top Record Hour)
    - cron: '30 17 * * *'
    # Slot 7: 22:30 IRST (19:00 UTC) - Islam Sobhi / Yasser Al-Dosari (Bedtime Peace)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel to execute'
        required: false
        default: 'quran'
        type: choice
        options:
          - quran
          - auto

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System FFmpeg and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Quran Viral Reel Dispatcher (>100k views, <50s)
        run: |
          python dispatch_cycle.py --channel=quran

      - name: Commit and Push Updated State (Keepalive Heartbeat Activity)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json growth_brain.json used_trends_history.json used_viral_reels.json
          git commit -m "Auto-keepalive heartbeat and viral reels state update [skip ci]" || echo "No changes to state"
          git push
