name: 24/7 Quran Viral Shorts Autopilot (Every 4 Hours - 6x Daily)

on:
  schedule:
    # Slot 1: 02:00 IRST (22:30 UTC) - Abdul Rahman Mossad / Raad Al-Kurdi
    - cron: '30 22 * * *'
    # Slot 2: 06:00 IRST (02:30 UTC) - Sheikh Yasser Al-Dosari (Fajr Peak)
    - cron: '30 2 * * *'
    # Slot 3: 10:00 IRST (06:30 UTC) - Youssef Saghir
    - cron: '30 6 * * *'
    # Slot 4: 14:00 IRST (10:30 UTC) - Sheikh Yasser Al-Dosari
    - cron: '30 10 * * *'
    # Slot 5: 18:00 IRST (14:30 UTC) - Muhammad Al-Luhaidan / Islam Sobhi (Maghrib Peak)
    - cron: '30 14 * * *'
    # Slot 6: 22:00 IRST (18:30 UTC) - Sheikh Yasser Al-Dosari (Bedtime Peace)
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel to execute'
        required: false
        default: 'quran'
        type: choice
        options:
          - quran
          - auto

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System FFmpeg and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Quran Viral Reel Dispatcher (>100k views, <50s)
        run: |
          python dispatch_cycle.py --channel=quran

      - name: Commit and Push Updated State (Keepalive Activity)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json growth_brain.json used_trends_history.json used_viral_reels.json
          git commit -m "Auto-keepalive heartbeat and viral reels state update [skip ci]" || echo "No changes to state"
          git push
