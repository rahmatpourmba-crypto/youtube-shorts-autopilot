name: 24/7 Autonomous Viral Multi-Channel Pulse (Quran & AI Unveiled)

on:
  schedule:
    # Resilient Pulse every 30 mins at odd minutes (:18 and :48)
    # Bypasses GitHub top-of-hour congestion, queue drops, and delays
    - cron: '18,48 * * * *'
    # Quran prime window 18:00-24:00 Baghdad (15:00-21:00 UTC): extra pulses so the
    # union is every 15 min (:03 :18 :33 :48); state.json gate enforces 8/day @45 min.
    - cron: '3,33 15-20 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel to execute'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - quran
          - ai
      force:
        description: 'Bypass cooling gate'
        required: false
        default: false
        type: boolean

concurrency:
  group: shorts-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DEDUPE_GIT: '1'
    steps:
      # IMPORTANT: a queued run's GITHUB_SHA is frozen when it is *triggered*. Without ref: main a
      # run that waited in the concurrency queue checks out stale state (root cause of the
      # 2026-10-30 duplicate). Always take the tip of main, then pull again right before dispatch.
      - name: Checkout Repository (latest main, not the trigger SHA)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git log -1 --format='state @ %h %ci'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore Credentials from Secure GitHub Secrets
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_QURAN_B64: ${{ secrets.TOKEN_QURAN_BASE64 }}
          TOKEN_AI_B64: ${{ secrets.TOKEN_AI_BASE64 }}
          TOKEN_POLYGON_B64: ${{ secrets.TOKEN_POLYGON_BASE64 }}
          TOKEN_ANIMALS_B64: ${{ secrets.TOKEN_ANIMALS_BASE64 }}
          IG_SESSION_QURAN_B64: ${{ secrets.IG_SESSION_QURAN_BASE64 }}
          IG_SESSION_CRYPTOLAB_B64: ${{ secrets.IG_SESSION_CRYPTOLAB_BASE64 }}
        run: |
          if [ -n "$CLIENT_SECRETS_JSON" ]; then echo "$CLIENT_SECRETS_JSON" > client_secrets.json; fi
          if [ -n "$TOKEN_QURAN_B64" ]; then echo "$TOKEN_QURAN_B64" | base64 -d > token_quran.pickle; fi
          if [ -n "$TOKEN_AI_B64" ]; then echo "$TOKEN_AI_B64" | base64 -d > token_ai.pickle; fi
          if [ -n "$TOKEN_POLYGON_B64" ]; then echo "$TOKEN_POLYGON_B64" | base64 -d > token_polygon.pickle; fi
          if [ -n "$TOKEN_ANIMALS_B64" ]; then echo "$TOKEN_ANIMALS_B64" | base64 -d > token_animals.pickle; fi
          if [ -n "$IG_SESSION_QURAN_B64" ]; then echo "$IG_SESSION_QURAN_B64" | base64 -d > ig_session_quran.json; fi
          if [ -n "$IG_SESSION_CRYPTOLAB_B64" ]; then echo "$IG_SESSION_CRYPTOLAB_B64" | base64 -d > ig_session_cryptolab.json; fi

      - name: Install System FFmpeg (with libass) and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs libass9 fontconfig
          ffmpeg -hide_banner -filters | grep -E ' (subtitles|ass) ' || echo "WARNING: ffmpeg lacks libass"

      # Whisper model for Quran ayah detection (quran_branding.py); cached across runs
      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/faster-whisper
          key: faster-whisper-small-v1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Multi-Channel Dispatcher
        env:
          IG_PASSWORD_CRYPTOLAB: ${{ secrets.IG_PASSWORD_CRYPTOLAB }}
          IG_PASSWORD_QURAN: ${{ secrets.IG_PASSWORD_QURAN }}
        run: |
          python dispatch_cycle.py --channel=${{ inputs.target_channel || 'auto' }} ${{ inputs.force && '--force' || '' }} ${{ github.event_name == 'schedule' && '--catchup-minutes=100' || '' }}

      - name: Commit and Push Updated State (Keepalive Heartbeat Activity - NO skip-ci)
        if: always()
        run: |
          git add claims upload_registry.json 2>/dev/null || true
          git add state.json growth_brain.json used_trends_history.json used_viral_reels.json used_ai_viral_reels.json
          git commit -m "chore(autopilot): update multi-channel state and keepalive heartbeat" || echo "No changes to state"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "Push rejected, retry $i"; sleep $((i*5))
          done
