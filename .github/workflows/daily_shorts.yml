name: 3x Daily Quran Viral Shorts Autopilot (15:00, 20:30, 22:00 IRST)

on:
  schedule:
    # 1. First Daily Slot: 15:00 IRST (11:30 UTC)
    - cron: '30 11 * * *'
    # 2. Second Daily Slot: 20:30 IRST (17:00 UTC)
    - cron: '0 17 * * *'
    # 3. Third Daily Slot: 22:00 IRST (18:30 UTC)
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Target Channel to execute'
        required: false
        default: 'quran'
        type: choice
        options:
          - quran
          - auto

permissions:
  contents: write

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System FFmpeg and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Quran Viral Reel Dispatcher (>100k views, <50s)
        run: |
          python dispatch_cycle.py --channel=quran

      - name: Commit and Push Updated State (Keepalive Activity)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json growth_brain.json used_trends_history.json used_viral_reels.json
          git commit -m "Auto-keepalive heartbeat and viral reels state update [skip ci]" || echo "No changes to state"
          git push

