name: 👑 Master Quran Factory (100% Cloud Autopilot - Zero Local PC Dependency)

on:
  schedule:
    # Golden Hours across Mecca & Middle East (UTC+3 / Tehran UTC+3:30):
    # 07:30 UTC = 11:00 AM Tehran (نوبت ظهر)
    # 14:00 UTC = 17:30 PM Tehran (نوبت عصر طلایی)
    # 18:30 UTC = 22:00 PM Tehran (نوبت شبانگاهی)
    - cron: '30 7 * * *'
    - cron: '0 14 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: master-quran-factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-master-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🔄 Sync Latest Git State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🔑 Restore Credentials from GitHub Secrets
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_QURAN_B64: ${{ secrets.TOKEN_QURAN_BASE64 }}
        run: |
          if [ -n "$CLIENT_SECRETS_JSON" ]; then
            echo "$CLIENT_SECRETS_JSON" > client_secrets.json
            echo "✓ Restored client_secrets.json from secrets"
          fi
          if [ -n "$TOKEN_QURAN_B64" ]; then
            echo "$TOKEN_QURAN_B64" | base64 -d > token_quran.pickle
            echo "✓ Restored token_quran.pickle from secrets"
          fi

      - name: 🎥 Install System FFmpeg & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass9 fontconfig

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Execute Master Quran Factory (Option A: 100% Fresh Trend Discovery)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_WATERMARK: "@NourAlQuran"
          QURAN_MASTER_SESSION_AUTH: "AUTHORIZED_786"
        run: |
          python master_quran_factory.py

      - name: 💾 Commit and Push Deduplication Registry to Cloud
        if: always()
        run: |
          git add used_radar_ids.json upload_registry.json state.json 2>/dev/null || true
          git commit -m "chore(factory): record published trend video in dedupe registry [skip ci]" || echo "No state changes"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "Push retry $i in 10s..."; sleep 10
          done
