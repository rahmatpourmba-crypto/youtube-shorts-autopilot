name: "Quran Challenge Shorts Autopilot (Iraq, Algeria, Egypt)"

on:
  schedule:
    # Daily at 19:00 UTC = 22:00 Iraq / 21:00 Egypt / 20:00 Algeria (Peak Evening Surge)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'produce-upload'
        type: choice
        options:
          - produce-upload
          - fix-channel
          - dry-run

concurrency:
  group: quran-challenge-autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-challenge-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: "Sync Latest Git State"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: "Install System Dependencies (FFmpeg & Arabic Fonts)"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fontconfig

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_quran_quiz.txt

      - name: "Execute Quran Challenge Autopilot"
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'produce-upload' }}
        run: |
          python quran_challenge_autopilot.py --mode "$MODE"

      - name: "Commit and Push State Updates"
        if: always()
        run: |
          git add output/quran_challenge_state.json upload_registry.json 2>/dev/null || true
          git commit -m "chore(quiz): update quran challenge state [skip ci]" || echo "No state changes to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "Retry push $i in 10s..."; sleep 10
          done
